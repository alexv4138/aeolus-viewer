<!doctype html><html><head><meta charset="utf-8"><title>Aeolus Frame Editor</title><style>body{font:14px Arial;margin:24px;background:#fff;color:#18201e}button,input{padding:8px;margin:4px}main{display:flex;gap:20px}#frames{width:170px;max-height:80vh;overflow:auto;border-right:1px solid #ddd}.thumb{display:block;width:140px;margin:6px;cursor:pointer;border:1px solid #ddd}.thumb.active{border:2px solid #277a59}canvas{max-width:900px;width:70vw;border:1px solid #ddd;cursor:crosshair}aside{min-width:220px}.hint{color:#68736e}</style></head><body><h1>Frame editor</h1><p class="hint">Load a video, draw a polygon, choose a replacement color, then apply it to selected frames.</p><input id="file" type="file" accept="video/*"><button id="load">Load frames</button><button id="save">Save selection</button><button id="apply">Apply to frame</button><button id="applyAll">Apply saved selection to all</button><input id="color" type="color" value="#ffffff"><button id="rebuild">Rebuild video</button><main><div id="frames"></div><section><canvas id="c"></canvas><p id="status"></p></section><aside><b>Saved selections</b><div id="saved">None</div><p class="hint">Rebuild uses the bundled ffmpeg through rebuild-video.ps1. Download edited frames, then run the script.</p></aside></main><script>
const file=document.querySelector('#file'), list=document.querySelector('#frames'), c=document.querySelector('#c'),x=c.getContext('2d'),status=document.querySelector('#status');let frames=[],i=0,poly=[],saved=[];
function draw(){if(!frames[i])return;x.putImageData(frames[i],0,0);x.strokeStyle='#e44';x.lineWidth=2;if(poly.length){x.beginPath();poly.forEach((p,n)=>n?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.stroke()}}
c.onclick=e=>{const r=c.getBoundingClientRect(),p={x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};poly.push(p);draw()};
document.querySelector('#load').onclick=async()=>{if(!file.files[0])return;const v=document.createElement('video');v.src=URL.createObjectURL(file.files[0]);await new Promise(z=>v.onloadedmetadata=z);const n=Math.floor(v.duration*v.frameRate||v.duration*24);c.width=v.videoWidth;c.height=v.videoHeight;frames=[];list.innerHTML='';for(let k=0;k<n;k++){v.currentTime=k/24;await new Promise(z=>v.onseeked=z);x.drawImage(v,0,0);const d=x.getImageData(0,0,c.width,c.height);frames.push(d);const im=document.createElement('img');im.className='thumb';im.src=c.toDataURL();im.onclick=()=>{i=k;poly=[];draw();document.querySelectorAll('.thumb').forEach(a=>a.classList.remove('active'));im.classList.add('active')};list.append(im)}status.textContent=frames.length+' frames loaded';i=0;draw()};
function paint(){if(!poly.length)return;const q=document.createElement('canvas');q.width=c.width;q.height=c.height;const z=q.getContext('2d');z.putImageData(frames[i],0,0);z.fillStyle=document.querySelector('#color').value;z.beginPath();poly.forEach((p,n)=>n?z.lineTo(p.x,p.y):z.moveTo(p.x,p.y));z.closePath();z.fill();frames[i]=z.getImageData(0,0,c.width,c.height);poly=[];draw()};document.querySelector('#apply').onclick=paint;document.querySelector('#save').onclick=()=>{if(poly.length){saved.push(poly.map(p=>({...p})));document.querySelector('#saved').textContent=saved.length+' saved selection(s)';}};document.querySelector('#applyAll').onclick=()=>{if(!saved.length)return;const old=poly;frames.forEach((_,k)=>{i=k;poly=saved[0].map(p=>({...p}));paint()});poly=old;draw()};document.querySelector('#rebuild').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(frames.map(d=>{const q=document.createElement('canvas');q.width=c.width;q.height=c.height;q.getContext('2d').putImageData(d,0,0);return q.toDataURL()})));status.textContent='Use rebuild-video.ps1 to encode edited frames with ffmpeg.'};
</script></body></html>
