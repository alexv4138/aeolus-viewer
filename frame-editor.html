<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aeolus Frame Editor</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#18201e;background:#fff}.bar{min-height:64px;border-bottom:1px solid #dbe1de;display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:8px 22px}.bar h1{font-size:17px;margin:0 18px 0 0}.bar button,.bar input,.bar select{font:inherit}.bar button{padding:8px 10px;background:#fff;border:1px solid #bfc9c4;cursor:pointer}.bar button:hover{border-color:#277a59}.bar label{display:flex;align-items:center;gap:7px}.bar output{min-width:45px;color:#68736e;font-size:12px}.workspace{display:grid;grid-template-columns:180px minmax(0,1fr) 230px;height:calc(100vh - 80px)}.frames{overflow:auto;border-right:1px solid #dbe1de;padding:10px}.frame{width:100%;display:block;margin:0 0 9px;padding:3px;border:1px solid transparent;background:#fff;cursor:pointer;text-align:left}.frame.active{border-color:#277a59}.frame img{display:block;width:100%;height:auto}.frame span{display:block;margin-top:4px;color:#68736e;font-size:11px}.canvas-pane{overflow:auto;min-width:0;min-height:0;background:#f7f9f8;padding:18px}.canvas-wrap{position:relative;width:max-content;height:max-content;line-height:0}.canvas-wrap canvas{display:block;border:1px solid #c9d1cd;background:#fff;touch-action:none;cursor:crosshair}.side{border-left:1px solid #dbe1de;padding:18px}.side h2{font-size:12px;letter-spacing:.1em;color:#68736e;margin:0 0 14px}.side p{line-height:1.45;color:#68736e}.saved{display:flex;flex-direction:column;gap:7px}.saved-row{display:grid;grid-template-columns:1fr auto;gap:5px}.saved-row button{background:#fff;border:1px solid #c9d1cd;padding:8px;text-align:left;cursor:pointer}.saved-row .selected{border-color:#277a59;color:#176d4c}.saved-row .delete{text-align:center;color:#a8402c}.saved-row button:hover{border-color:#277a59}.status{margin-left:auto;color:#68736e;font-size:12px}.download{display:none;color:#176d4c;text-decoration:none;font-weight:bold}.download.show{display:inline}
</style></head><body>
<header class="bar"><h1>AEOLUS / FRAME EDITOR</h1><button id="loadBundled">Load turbine</button><label>Other video <input id="file" type="file" accept="video/*"></label><label>Tool <select id="tool"><option value="lasso">Lasso</option><option value="brush">Brush</option></select></label><label>Brush <input id="brushSize" type="range" min="1" max="250" value="16"><output id="brushValue">16 px</output></label><button id="zoomOut" title="Zoom out">−</button><label>Zoom <input id="zoom" type="range" min="25" max="800" step="25" value="100"><output id="zoomValue">100%</output></label><button id="zoomIn" title="Zoom in">+</button><button id="undo">Undo</button><button id="clear">Clear selection</button><button id="save">Save selection</button><button id="apply">Fill selected area</button><button id="applySavedCurrent">Apply saved to this frame</button><button id="applySaved">Apply saved to all frames</button><label>Fill <input id="color" type="color" value="#ffffff"></label><button id="rebuild">Rebuild MP4</button><a id="download" class="download">Download video</a><span id="status" class="status">Loading turbine…</span></header>
<main class="workspace"><aside id="frames" class="frames"></aside><section class="canvas-pane"><div class="canvas-wrap"><canvas id="canvas"></canvas></div></section><aside class="side"><h2>SELECTIONS</h2><div id="saved" class="saved"></div><p>Hold the mouse button and draw a freehand lasso around the area. The selected region fills with the chosen color.</p><p>Saved selections retain their proportional position, so they can be applied to every frame.</p></aside></main>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),framesPane=document.querySelector('#frames'),savedPane=document.querySelector('#saved'),toolInput=document.querySelector('#tool'),brushInput=document.querySelector('#brushSize'),brushValue=document.querySelector('#brushValue'),zoomInput=document.querySelector('#zoom'),zoomValue=document.querySelector('#zoomValue');
let frames=[],current=0,path=[],drawing=false,saved=[],selectedSaved=-1,fps=24,tool='lasso',brushSize=16,zoom=100,lastBrushPoint=null;
function render(){if(!frames.length)return;ctx.putImageData(frames[current].image,0,0);if(path.length>1){ctx.strokeStyle='#e45b39';ctx.lineWidth=Math.max(2,canvas.width/500);ctx.beginPath();path.forEach((p,n)=>n?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function setZoom(value){zoom=Math.max(25,Math.min(800,Number(value)));zoomInput.value=zoom;zoomValue.textContent=`${zoom}%`;if(canvas.width){canvas.style.width=`${canvas.width*zoom/100}px`;canvas.style.height=`${canvas.height*zoom/100}px`}}
function snapshot(){frames[current].history.push(new ImageData(new Uint8ClampedArray(frames[current].image.data),canvas.width,canvas.height))}
function paintBrush(from,to){const off=document.createElement('canvas'),o=off.getContext('2d');off.width=canvas.width;off.height=canvas.height;o.putImageData(frames[current].image,0,0);o.strokeStyle=document.querySelector('#color').value;o.fillStyle=o.strokeStyle;o.lineCap='round';o.lineJoin='round';o.lineWidth=brushSize;o.beginPath();o.moveTo(from.x,from.y);o.lineTo(to.x,to.y);o.stroke();o.beginPath();o.arc(to.x,to.y,brushSize/2,0,Math.PI*2);o.fill();frames[current].image=o.getImageData(0,0,canvas.width,canvas.height);render()}
canvas.addEventListener('pointerdown',e=>{if(!frames.length)return;drawing=true;const p=point(e);canvas.setPointerCapture(e.pointerId);if(tool==='brush'){snapshot();lastBrushPoint=p;paintBrush(p,p)}else{path=[p];render()}});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);if(tool==='brush'){paintBrush(lastBrushPoint,p);lastBrushPoint=p}else{path.push(p);render()}});
canvas.addEventListener('pointerup',e=>{if(!drawing)return;drawing=false;if(tool==='brush'){lastBrushPoint=null;renderFrames()}else{if(path.length>2)path.push({...path[0]});render()}});
function thumbnail(image){const t=document.createElement('canvas');t.width=160;t.height=Math.round(image.height/image.width*160);t.getContext('2d').putImageData(image,0,0);return t.toDataURL('image/jpeg',.72)}
function renderFrames(){framesPane.replaceChildren(...frames.map((frame,index)=>{const b=document.createElement('button'),img=new Image(),label=document.createElement('span');b.className='frame'+(index===current?' active':'');img.src=thumbnail(frame.image);label.textContent=`Frame ${index+1}`;b.append(img,label);b.onclick=()=>{current=index;path=[];render();renderFrames()};return b}))}
function seek(video,time){return new Promise((resolve,reject)=>{const done=()=>resolve();video.addEventListener('seeked',done,{once:true});video.addEventListener('error',()=>reject(video.error),{once:true});video.currentTime=time})}
async function loadVideo(src){status.textContent='Reading frames…';const video=document.createElement('video');video.muted=true;video.preload='auto';await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(video.error);video.src=src;video.load()});const count=Math.max(1,Math.round(video.duration*fps));canvas.width=video.videoWidth;canvas.height=video.videoHeight;setZoom(100);frames=[];for(let index=0;index<count;index++){await seek(video,Math.min(index/fps,video.duration-.001));ctx.drawImage(video,0,0);frames.push({image:ctx.getImageData(0,0,canvas.width,canvas.height),history:[]})}current=0;path=[];render();renderFrames();status.textContent=`${frames.length} frames loaded`}
async function loadBundled(){try{await loadVideo('turbine.mp4')}catch{await loadVideo('turbine.webm')}}
function fillSelection(targetPath){if(targetPath.length<3)return;const off=document.createElement('canvas'),o=off.getContext('2d');off.width=canvas.width;off.height=canvas.height;o.putImageData(frames[current].image,0,0);o.fillStyle=document.querySelector('#color').value;o.beginPath();targetPath.forEach((p,n)=>n?o.lineTo(p.x,p.y):o.moveTo(p.x,p.y));o.closePath();o.fill();frames[current].image=o.getImageData(0,0,canvas.width,canvas.height)}
function normalize(points){return points.map(p=>({x:p.x/canvas.width,y:p.y/canvas.height}))}function denormalize(points){return points.map(p=>({x:p.x*canvas.width,y:p.y*canvas.height}))}
function renderSaved(){savedPane.replaceChildren(...saved.map((mask,index)=>{const row=document.createElement('div'),choose=document.createElement('button'),del=document.createElement('button');row.className='saved-row';choose.className=index===selectedSaved?'selected':'';choose.textContent=mask.name;choose.onclick=()=>{selectedSaved=index;path=denormalize(mask.points);render();renderSaved()};del.className='delete';del.textContent='Delete';del.onclick=()=>{saved.splice(index,1);if(selectedSaved===index)selectedSaved=-1;else if(selectedSaved>index)selectedSaved--;renderSaved();status.textContent='Selection deleted'};row.append(choose,del);return row}))}
document.querySelector('#loadBundled').onclick=()=>loadBundled().catch(()=>status.textContent='Could not load turbine video');document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(f)loadVideo(URL.createObjectURL(f)).catch(()=>status.textContent='Could not load selected video')};
toolInput.onchange=()=>{tool=toolInput.value;path=[];render()};brushInput.oninput=()=>{brushSize=Number(brushInput.value);brushValue.textContent=`${brushSize} px`};zoomInput.oninput=()=>setZoom(zoomInput.value);document.querySelector('#zoomOut').onclick=()=>setZoom(zoom-25);document.querySelector('#zoomIn').onclick=()=>setZoom(zoom+25);
document.querySelector('#clear').onclick=()=>{path=[];render()};document.querySelector('#save').onclick=()=>{if(path.length<3)return;const mask={name:`Selection ${saved.length+1}`,points:normalize(path)};saved.push(mask);selectedSaved=saved.length-1;path=[];render();renderSaved();status.textContent=`${mask.name} saved — draw another selection`};
document.querySelector('#undo').onclick=()=>{const previous=frames[current]?.history.pop();if(!previous)return;frames[current].image=previous;path=[];render();renderFrames();status.textContent=`Undid change on frame ${current+1}`};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();document.querySelector('#undo').click()}});
document.querySelector('#apply').onclick=()=>{if(path.length<3)return;snapshot();fillSelection(path);path=[];render();renderFrames()};document.querySelector('#applySavedCurrent').onclick=()=>{if(selectedSaved<0)return;snapshot();fillSelection(denormalize(saved[selectedSaved].points));path=[];render();renderFrames();status.textContent=`${saved[selectedSaved].name} applied to frame ${current+1}`};document.querySelector('#applySaved').onclick=()=>{if(selectedSaved<0)return;frames.forEach((_,index)=>{current=index;snapshot();fillSelection(denormalize(saved[selectedSaved].points))});current=0;path=[];render();renderFrames();status.textContent='Selection applied to every frame'};
document.querySelector('#rebuild').onclick=async()=>{if(!frames.length)return;status.textContent='Building MP4 with FFmpeg…';const data=frames.map(frame=>{const off=document.createElement('canvas');off.width=canvas.width;off.height=canvas.height;off.getContext('2d').putImageData(frame.image,0,0);return off.toDataURL('image/png')});const response=await fetch('/rebuild',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fps,frames:data})});if(!response.ok){status.textContent='Rebuild failed';return}const result=await response.json(),a=document.querySelector('#download');a.href=result.url;a.download='aeolus-edited.mp4';a.classList.add('show');status.textContent='MP4 ready'};
loadBundled().catch(()=>status.textContent='Could not load turbine video');
</script></body></html>
