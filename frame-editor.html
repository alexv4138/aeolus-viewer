<!doctype html><html><head><meta charset="utf-8"><title>Aeolus Frame Editor</title><style>body{margin:18px;font:14px Arial;background:#fff;color:#18201e}button,input{padding:8px;margin:4px}main{display:flex;gap:20px;align-items:flex-start;height:78vh}#frames{width:170px;height:100%;overflow:auto;border-right:1px solid #ddd}.thumb{display:block;width:140px;margin:6px;cursor:pointer;border:1px solid #ddd}.thumb.active{border:2px solid #277a59}section{height:100%;display:flex;flex-direction:column;align-items:center;min-width:0}canvas{max-height:72vh;max-width:calc(100vw - 470px);width:auto;height:auto;border:1px solid #ddd;cursor:crosshair;object-fit:contain}aside{min-width:220px}.hint{color:#68736e}</style></head><body><h1>Aeolus Frame Editor</h1><p class="hint">Loads <code>turbine.mp4</code> beside this file. You can also choose another video.</p><button id="loadBundled">Load turbine.mp4</button><input id="file" type="file" accept="video/*"><button id="loadFile">Load selected video</button><button id="save">Save selection</button><button id="apply">Apply to frame</button><button id="applyAll">Apply saved selection to all</button><input id="color" type="color" value="#ffffff"><button id="rebuild">Rebuild video</button><main><div id="frames"></div><section><canvas id="c"></canvas><p id="status">Ready.</p></section><aside><b>Saved selections</b><div id="saved">None</div><p class="hint">Frame editing is local. The rebuild helper uses your installed FFmpeg.</p></aside></main><script>const list=document.querySelector('#frames'),c=document.querySelector('#c'),x=c.getContext('2d'),status=document.querySelector('#status');let frames=[],i=0,poly=[],saved=[];function draw(){if(!frames[i])return;x.putImageData(frames[i],0,0);if(poly.length){x.strokeStyle='#e44';x.lineWidth=2;x.beginPath();poly.forEach((p,n)=>n?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.stroke()}}c.onclick=e=>{if(!frames.length)return;const r=c.getBoundingClientRect();poly.push({x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height});draw()};async function loadFrames(src){status.textContent='Loading frames…';const v=document.createElement('video');v.muted=true;v.preload='auto';v.src=src;await new Promise((ok,bad)=>{v.onloadedmetadata=ok;v.onerror=()=>bad(new Error('Could not open video'))});const fps=24,n=Math.max(1,Math.ceil(v.duration*fps));c.width=v.videoWidth;c.height=v.videoHeight;frames=[];list.innerHTML='';for(let k=0;k<n;k++){await new Promise(ok=>{v.onseeked=ok;v.currentTime=Math.min(k/fps,Math.max(0,v.duration-.001))});x.drawImage(v,0,0,c.width,c.height);frames.push(x.getImageData(0,0,c.width,c.height));const im=document.createElement('img');im.className='thumb';im.src=c.toDataURL('image/png');im.onclick=()=>{i=k;poly=[];draw();document.querySelectorAll('.thumb').forEach(a=>a.classList.remove('active'));im.classList.add('active')};list.append(im)}i=0;draw();status.textContent=`${frames.length} frames loaded.`}document.querySelector('#loadBundled').onclick=()=>loadFrames('turbine.mp4').catch(e=>status.textContent=`Could not load turbine.mp4: ${e.message}`);document.querySelector('#loadFile').onclick=()=>{const f=document.querySelector('#file').files[0];if(f)loadFrames(URL.createObjectURL(f)).catch(e=>status.textContent=e.message)};document.querySelector('#save').onclick=()=>{if(poly.length){saved.push(poly.map(p=>({...p})));document.querySelector('#saved').textContent=`${saved.length} saved selection(s)`}};function paint(){if(!poly.length)return;const q=document.createElement('canvas');q.width=c.width;q.height=c.height;const z=q.getContext('2d');z.putImageData(frames[i],0,0);z.fillStyle=document.querySelector('#color').value;z.beginPath();poly.forEach((p,n)=>n?z.lineTo(p.x,p.y):z.moveTo(p.x,p.y));z.closePath();z.fill();frames[i]=z.getImageData(0,0,c.width,c.height);poly=[];draw()}document.querySelector('#apply').onclick=paint;document.querySelector('#applyAll').onclick=()=>{if(!saved.length)return;frames.forEach((_,k)=>{i=k;poly=saved[0].map(p=>({...p}));paint()});draw()};document.querySelector('#rebuild').onclick=()=>status.textContent='Edited frames are ready. Run rebuild-video.ps1 after exporting frames.';document.querySelector('#loadBundled').click();</script></body></html>
